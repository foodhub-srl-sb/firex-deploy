    <script>
      // Sfondo generato: due mondi disegnati su canvas 2D, in funzione del tempo (seek-safe).
      // Mondo A (fino a SWITCH): una sola strada dritta, grigia, monotona.
      // Mondo B (da SWITCH): esplosione di direzioni luminose nei colori del brand.
      (function () {
        const BLEED = 120; // margine oltre il fotogramma per zoom e rotazione
        const FW = 1080;
        const FH = 1920;
        const VP = { x: 600, y: 820 }; // punto di fuga, nascosto dietro la testa
        const SWITCH = window.WORLD_SWITCH || 3.64;

        const canvas = document.getElementById("world");
        canvas.width = FW + BLEED * 2;
        canvas.height = FH + BLEED * 2;
        const ctx = canvas.getContext("2d");

        // pseudo-casuale con seme fisso: stesso risultato a ogni render
        function rng(seed) {
          return function () {
            seed |= 0;
            seed = (seed + 0x6d2b79f5) | 0;
            let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        const clamp01 = (v) => Math.min(1, Math.max(0, v));
        const easeOut = (k) => 1 - Math.pow(1 - clamp01(k), 3);

        const BRAND = ["#3da35d", "#9be15d", "#f28c28", "#ffffff", "#3da35d", "#e9f7a8"];
        const r1 = rng(7);
        const RAYS = Array.from({ length: 34 }, (_, i) => ({
          a: (i / 34) * Math.PI * 2 + (r1() - 0.5) * 0.12,
          w: 2 + r1() * 7,
          c: BRAND[Math.floor(r1() * BRAND.length)],
          delay: r1() * 0.18,
          speed: 0.6 + r1() * 0.9,
          phase: r1(),
        }));
        const r2 = rng(42);
        const DOTS = Array.from({ length: 140 }, () => ({
          a: r2() * Math.PI * 2,
          v: 250 + r2() * 1300,
          s: 2 + r2() * 6,
          o: r2() * 0.6,
          c: BRAND[Math.floor(r2() * BRAND.length)],
        }));

        function worldA(t) {
          // parete piatta e pavimento: toni grigi, poca vita
          const g = ctx.createLinearGradient(0, -BLEED, 0, FH + BLEED);
          g.addColorStop(0, "#2b302d");
          g.addColorStop(0.42, "#3a3f3b");
          g.addColorStop(0.43, "#1f2320");
          g.addColorStop(1, "#141715");
          ctx.fillStyle = g;
          ctx.fillRect(-BLEED, -BLEED, FW + BLEED * 2, FH + BLEED * 2);

          // l'unica strada, dritta fino al punto di fuga
          const bottom = FH + BLEED;
          const halfW = 520;
          ctx.fillStyle = "#4a4f4b";
          ctx.beginPath();
          ctx.moveTo(VP.x - 6, VP.y);
          ctx.lineTo(VP.x + 6, VP.y);
          ctx.lineTo(VP.x + halfW, bottom);
          ctx.lineTo(VP.x - halfW, bottom);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = "rgba(230,230,225,0.55)";
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.moveTo(VP.x - 5, VP.y);
          ctx.lineTo(VP.x - halfW + 30, bottom);
          ctx.moveTo(VP.x + 5, VP.y);
          ctx.lineTo(VP.x + halfW - 30, bottom);
          ctx.stroke();

          // tratteggio centrale che scorre verso di noi
          const D = bottom - VP.y;
          for (let i = 0; i < 14; i++) {
            const z0 = ((i + t * 1.6) % 14) / 14; // 0 = lontano, 1 = vicino
            const zA = Math.pow(z0, 2.2);
            const zB = Math.pow(Math.min(1, z0 + 0.035), 2.2);
            const yA = VP.y + D * zA;
            const yB = VP.y + D * zB;
            const wA = 2 + 22 * zA;
            const wB = 2 + 22 * zB;
            ctx.fillStyle = "rgba(235,235,225,0.8)";
            ctx.beginPath();
            ctx.moveTo(VP.x - wA / 2, yA);
            ctx.lineTo(VP.x + wA / 2, yA);
            ctx.lineTo(VP.x + wB / 2, yB);
            ctx.lineTo(VP.x - wB / 2, yB);
            ctx.fill();
          }

          // vignettatura pesante
          const v = ctx.createRadialGradient(VP.x, VP.y, 200, VP.x, VP.y, 1500);
          v.addColorStop(0, "rgba(0,0,0,0)");
          v.addColorStop(1, "rgba(0,0,0,0.7)");
          ctx.fillStyle = v;
          ctx.fillRect(-BLEED, -BLEED, FW + BLEED * 2, FH + BLEED * 2);
        }

        function worldB(t) {
          const u = t - SWITCH; // secondi dall'esplosione
          const open = easeOut(u / 0.45);

          // luce che si apre dal punto di fuga
          const g = ctx.createRadialGradient(VP.x, VP.y, 0, VP.x, VP.y, 1700);
          g.addColorStop(0, "#fffbe6");
          g.addColorStop(0.12 + 0.05 * open, "#d8f5a0");
          g.addColorStop(0.35, "#3da35d");
          g.addColorStop(0.75, "#0f4d33");
          g.addColorStop(1, "#06261a");
          ctx.fillStyle = g;
          ctx.fillRect(-BLEED, -BLEED, FW + BLEED * 2, FH + BLEED * 2);

          // griglia a pavimento che scorre
          ctx.save();
          ctx.strokeStyle = "rgba(233,247,168,0.35)";
          ctx.lineWidth = 2;
          const bottom = FH + BLEED;
          const D = bottom - VP.y;
          for (let i = -14; i <= 14; i++) {
            ctx.beginPath();
            ctx.moveTo(VP.x, VP.y);
            ctx.lineTo(VP.x + i * 160 * open, bottom);
            ctx.stroke();
          }
          for (let i = 0; i < 12; i++) {
            const z = Math.pow(((i + u * 2.4) % 12) / 12, 2.2);
            const y = VP.y + D * z;
            ctx.globalAlpha = z * open;
            ctx.beginPath();
            ctx.moveTo(-BLEED, y);
            ctx.lineTo(FW + BLEED, y);
            ctx.stroke();
          }
          ctx.restore();

          // raggi: le mille direzioni, con impulsi di luce che corrono verso l'esterno
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          const maxL = 2000;
          for (const r of RAYS) {
            const k = easeOut((u - r.delay) / 0.4);
            if (k <= 0) continue;
            const L = maxL * k;
            const dx = Math.cos(r.a);
            const dy = Math.sin(r.a);
            const lg = ctx.createLinearGradient(VP.x, VP.y, VP.x + dx * L, VP.y + dy * L);
            lg.addColorStop(0, "rgba(255,255,255,0.9)");
            lg.addColorStop(0.5, r.c);
            lg.addColorStop(1, "rgba(0,0,0,0)");
            ctx.strokeStyle = lg;
            ctx.lineWidth = r.w;
            ctx.globalAlpha = 0.75;
            ctx.beginPath();
            ctx.moveTo(VP.x, VP.y);
            ctx.lineTo(VP.x + dx * L, VP.y + dy * L);
            ctx.stroke();
            // impulso
            const p = (r.phase + u * r.speed) % 1;
            const pd = 120 + p * 1500;
            if (pd < L) {
              ctx.globalAlpha = 1 - p * 0.6;
              ctx.fillStyle = "#ffffff";
              ctx.beginPath();
              ctx.arc(VP.x + dx * pd, VP.y + dy * pd, r.w * 1.4, 0, Math.PI * 2);
              ctx.fill();
            }
          }
          // particelle che esplodono dal centro
          for (const d of DOTS) {
            const dist = d.v * Math.max(0, u - d.o * 0.3);
            if (dist <= 0) continue;
            ctx.globalAlpha = clamp01(1 - dist / 1600);
            ctx.fillStyle = d.c;
            ctx.beginPath();
            ctx.arc(VP.x + Math.cos(d.a) * dist, VP.y + Math.sin(d.a) * dist, d.s, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();

          // onda d'urto
          if (u < 0.6) {
            ctx.save();
            ctx.globalAlpha = 1 - u / 0.6;
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 30 * (1 - u / 0.6) + 4;
            ctx.beginPath();
            ctx.arc(VP.x, VP.y, 60 + easeOut(u / 0.6) * 1500, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }
        }

        function render(t) {
          ctx.setTransform(1, 0, 0, 1, BLEED, BLEED);
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = "source-over";
          if (t < SWITCH) worldA(t);
          else worldB(t);
        }

        window.__renderers = window.__renderers || [];
        window.__renderers.push(render);
        render(0);
      })();
    </script>
    <script>
      // Sottotitoli: 2-3 parole, lettere rosse (parole chiave verdi) mentre si parla.
      window.buildCaptions = function (tl) {
        const caps = document.getElementById("caps");
        // Word timings on the rough cut (renders/roughcut.mp4 = source 1.38s → 6.22s).
        // Checked against the audio envelope, never cut inside a word.
        const WORDS = [
          { w: "Se", s: 0.1, e: 0.28 },
          { w: "pensi", s: 0.3, e: 0.6 },
          { w: "che", s: 0.62, e: 0.72 },
          { w: "l'innovazione", s: 0.72, e: 1.38 },
          { w: "nel", s: 1.38, e: 1.52 },
          { w: "food", s: 1.52, e: 1.68 },
          { w: "abbia", s: 1.68, e: 2.06 },
          { w: "una", s: 2.08, e: 2.28 },
          { w: "sola", s: 2.28, e: 2.6, key: true },
          { w: "direzione,", s: 2.6, e: 3.58, key: true },
          { w: "guarda", s: 3.68, e: 4.06 },
          { w: "meglio.", s: 4.06, e: 4.64, key: true },
        ];
        // 2-3 words on screen at a time.
        const GROUPS = [
          { words: [0, 1], s: 0.06, e: 0.62 },
          { words: [2, 3], s: 0.62, e: 1.38 },
          { words: [4, 5, 6], s: 1.38, e: 2.08 },
          { words: [7, 8], s: 2.08, e: 2.6 },
          { words: [9], s: 2.6, e: 3.64 },
          { words: [10, 11], s: 3.64, e: 4.84 },
        ];

        const RED = "#ff2b2b";
        const GREEN = "#3da35d";

        // ---- Captions: letters light up red while spoken (keywords in green) ----
        GROUPS.forEach((g, gi) => {
          const grp = document.createElement("div");
          grp.className = "grp";
          grp.id = "grp-" + gi;
          g.words.forEach((wi) => {
            const word = WORDS[wi];
            const wEl = document.createElement("span");
            wEl.className = "w";
            [...word.w].forEach((c) => {
              const ch = document.createElement("span");
              ch.className = "ch";
              ch.textContent = c;
              wEl.appendChild(ch);
            });
            grp.appendChild(wEl);
          });
          caps.appendChild(grp);

          tl.fromTo(
            grp,
            { opacity: 0, scale: 0.86, y: 18 },
            { opacity: 1, scale: 1, y: 0, duration: 0.12, ease: "back.out(2.2)" },
            g.s,
          );
          tl.set(grp, { opacity: 0 }, g.e);

          g.words.forEach((wi, k) => {
            const word = WORDS[wi];
            const letters = grp.children[k].children;
            const n = letters.length;
            const step = (word.e - word.s) / n;
            const color = word.key ? GREEN : RED;
            for (let i = 0; i < n; i++) {
              const t = word.s + i * step;
              tl.set(letters[i], { color }, t);
              tl.fromTo(
                letters[i],
                { scale: 1.22, y: -6 },
                { scale: 1, y: 0, duration: 0.14, ease: "power2.out" },
                t,
              );
            }
          });
        });
      };
    </script>
    <script>
      const tl = gsap.timeline({ paused: true });
      const SWITCH = window.WORLD_SWITCH;

      buildCaptions(tl);

      // ---- "FOOD" slams in behind the person, blows away on the world change ----
      const fl = document.querySelectorAll("#food .fl");
      fl.forEach((el, i) => {
        tl.fromTo(
          el,
          { opacity: 0, scale: 1.9, y: -40 },
          { opacity: 1, scale: 1, y: 0, duration: 0.16, ease: "power4.out" },
          1.5 + i * 0.05,
        );
      });
      tl.to("#food", { scale: 1.06, duration: 2, ease: "none" }, 1.7);
      tl.to("#food", { scale: 1.5, opacity: 0, filter: "blur(10px)", duration: 0.22, ease: "power2.in" }, SWITCH - 0.06);

      // ---- Flash on the switch ----
      tl.fromTo("#flash-el", { opacity: 0 }, { opacity: 0.9, duration: 0.05, ease: "none" }, SWITCH - 0.04);
      tl.to("#flash-el", { opacity: 0, duration: 0.3, ease: "power2.out" }, SWITCH + 0.01);

      // ---- Zooms (4 kinds). Depth factors give parallax: world 0.5, text 0.75, person 1 ----
      const LAYERS = [
        ["#bgcam", 0.5],
        ["#txtcam", 0.75],
        ["#pcam", 1],
      ];
      function zoom(t, v, duration, ease) {
        LAYERS.forEach(([sel, f]) => {
          const p = { duration, ease };
          if (v.scale !== undefined) p.scale = 1 + (v.scale - 1) * f;
          if (v.rotation !== undefined) p.rotation = v.rotation * f;
          if (v.blur !== undefined) p.filter = `blur(${v.blur}px)`;
          tl.to(sel, p, t);
        });
      }
      LAYERS.forEach(([sel]) => tl.set(sel, { scale: 1, rotation: 0, filter: "blur(0px)" }, 0));
      // 1) slow push-in on "Se pensi che l'innovazione"
      zoom(0.06, { scale: 1.1 }, 1.3, "sine.inOut");
      // 2) hard punch-in on "food"
      zoom(1.52, { scale: 1.32 }, 0.09, "power4.out");
      // 3) smooth pull-back on "una sola", back to 1.0 before the arm goes up
      zoom(2.08, { scale: 1 }, 0.42, "expo.inOut");
      // 4) crash zoom with twist + motion blur on "guarda" (the world changes here)
      zoom(3.56, { scale: 1.42, rotation: -2.5 }, 0.14, "expo.in");
      zoom(3.6, { blur: 6 }, 0.1, "expo.in");
      zoom(3.7, { blur: 0 }, 0.08, "power2.out");
      zoom(3.7, { rotation: 0 }, 0.22, "back.out(2)");
      //    ...and a last snap on "meglio"
      zoom(4.06, { scale: 1.56 }, 0.1, "power4.out");
      zoom(4.16, { scale: 1.6 }, 0.7, "none");

      // canvas layers (world, bulb) redraw from the timeline time
      window.__renderers = window.__renderers || [];
      const renderAll = (t) => window.__renderers.forEach((r) => r(t));
      tl.eventCallback("onUpdate", () => renderAll(tl.time()));
      window.addEventListener("hf-seek", (ev) => renderAll(ev.detail.time));

      window.__timelines["main"] = tl;
    </script>
