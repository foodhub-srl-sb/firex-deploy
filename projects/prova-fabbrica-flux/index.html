<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />

    <style>
      /* Stile Food Hub: vedi CLAUDE.md alla radice del repository */
      :root {
        --cr: #d3134a;
        --gr: #45b07a;
        --gr-dark: #1e7f52;
        --or: #f5a269;
        --ye: #fde57d;
        --ye-deep: #f7c628;
        --wh: #ffffff;
        --ink: #2b2f36;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--cr); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--cr); font-family: "Montserrat", sans-serif; }
      .scene, .layer, .bg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .scene { overflow: hidden; }
      .abs { position: absolute; display: block; }
      img, video.fill { display: block; }
      video.fill { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      /* etichette bianche inclinate */
      .lbl {
        position: absolute; display: block; background: var(--wh); color: var(--cr);
        font-weight: 800; line-height: 1.08; padding: 0.06em 0.3em 0.12em;
        white-space: nowrap; transform-origin: 0% 50%; letter-spacing: -0.01em;
      }
      .lbl .row { display: block; }
      .ln { display: block; overflow: hidden; padding-bottom: 0.08em; margin-bottom: -0.08em; }
      .ln > span { display: block; }
      .kw { position: relative; display: inline-block; isolation: isolate; }
      .mk {
        position: absolute; display: block; left: -0.12em; right: -0.12em; bottom: 0.05em;
        height: 0.18em; border-radius: 0.08em; transform-origin: 0% 50%; z-index: -1; background: var(--ye-deep);
      }
      .src { position: absolute; display: block; font-size: 26px; font-weight: 500; }

      /* scena 1 (esempio) */
      #s1-l1 { left: 80px; top: 420px; font-size: 130px; }
      #s1-l2 { left: 150px; top: 600px; font-size: 130px; color: var(--gr); }
      #s1-tag { left: 0; top: 1300px; font-size: 54px; font-weight: 700; background: var(--gr); color: var(--wh); padding: 0.18em 0.6em 0.22em 0.9em; }


      /* prova fabbrica */
      #cam { position: absolute; inset: 0; width: 100%; height: 100%; transform-origin: 54% 36%; }
      .bgimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #me { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #shadow { position: absolute; left: 330px; top: 1760px; width: 420px; height: 60px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(0,0,0,0.45), rgba(0,0,0,0) 70%); }
      #grade { position: absolute; inset: 0; width: 100%; height: 100%; background: linear-gradient(180deg, rgba(0,0,0,0.18), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.35)); }
      .sub {
        position: absolute; left: 60px; top: 1210px; width: 880px; text-align: center;
        font-weight: 800; font-size: 86px; line-height: 1.05; color: #fff;
        text-shadow: 0 4px 0 rgba(0,0,0,0.35), 0 0 24px rgba(0,0,0,0.35); opacity: 0;
      }
      .sub .key { color: var(--ye-deep); }
      .arrow { position: absolute; display: block; left: 440px; top: 640px; width: 200px; height: 200px; transform-origin: 50% 50%; }

      /* chiusura */
      #end-logo { left: 340px; top: 520px; width: 400px; height: 583px; }
      #end-name { left: 0; top: 1170px; width: 1080px; text-align: center; color: var(--cr); font-weight: 800; font-size: 120px; letter-spacing: -0.02em; }

      <!-- Musica originale: python scripts/synth-audio.py (lo fa già scripts/new-project.sh) -->
      <audio id="music" src="audio/music.wav" data-start="0" data-duration="9.6" data-track-index="10" data-volume="0.12"></audio>
      <audio id="voce" src="audio/voce.wav" data-start="0" data-duration="6.4" data-track-index="9" data-volume="1"></audio>

      <audio id="sfx-02" src="audio/whoosh-down.wav" data-start="5.1" data-duration="0.6" data-track-index="12" data-volume="0.5"></audio>

    <script>
      const tl = gsap.timeline({ paused: true });
      const E = { out: "power3.out", in: "power3.in", back: "back.out(2)", el: "elastic.out(1, 0.55)" };

      // ---------- funzioni di animazione dello stile Food Hub ----------
      // etichetta che "sbatte" in posizione con rimbalzo
      function slap(sel, t, rot, from = -14) {
        tl.fromTo(sel, { opacity: 0, scale: 1.9, rotation: rot + from, y: -30 }, { opacity: 1, scale: 1, rotation: rot, y: 0, duration: 0.5, ease: "back.out(2.4)" }, t);
      }
      // etichetta che si srotola da sinistra
      function unroll(sel, t, rot) {
        tl.fromTo(sel, { opacity: 1, scaleX: 0, rotation: rot }, { scaleX: 1, rotation: rot, duration: 0.5, ease: "power4.out" }, t);
      }
      // righe di testo (.ln > span) che salgono da una maschera
      function lines(sel, t, stagger = 0.12) {
        tl.fromTo(sel + " .ln > span", { yPercent: 110 }, { yPercent: 0, duration: 0.6, ease: E.out, stagger }, t);
      }
      // evidenziatore sotto una parola (.kw con dentro <i class="mk">)
      function mark(sel, t, d = 0.35) {
        tl.fromTo(sel + " .mk", { scaleX: 0 }, { scaleX: 1, duration: d, ease: "power2.inOut" }, t);
      }
      // contatore numerico con la virgola italiana
      function count(sel, t, to, d, dec = 1) {
        const o = { v: 0 };
        const el = document.querySelector(sel);
        tl.fromTo(o, { v: 0 }, { v: to, duration: d, ease: "power2.out", onUpdate: () => (el.textContent = o.v.toFixed(dec).replace(".", ",")) }, t);
      }
      // apertura circolare di una scena (sfondo e contenuto insieme)
      function reveal(ids, t, at = "50% 50%") {
        tl.fromTo(ids, { clipPath: `circle(0% at ${at})` }, { clipPath: `circle(150% at ${at})`, duration: 0.8, ease: "power3.inOut" }, t);
      }

      // ================= RIPRESA =================
      // leggero movimento di camera sullo sfondo (Ken Burns)
      // sottotitoli: ogni gruppo entra con un piccolo pop
      ["#sub1", "#sub2", "#sub3", "#sub4", "#sub5", "#sub6"].forEach((sel) => {
        const t = parseFloat(document.querySelector(sel).dataset.start);
        tl.fromTo(sel, { opacity: 0, scale: 0.85, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.18, ease: "back.out(2.5)" }, t);
      });
      // «direzione»: punch-in 1.2x e frecce in quattro direzioni
      tl.to("#cam", { scale: 1.2, duration: 0.35, ease: "power3.out" }, 3.98);
      [["#ar1", 0, -380, 0], ["#ar2", 180, 380, 0], ["#ar3", -90, 0, -380], ["#ar4", 45, 300, 300]].forEach(([sel, rot, x, y]) => {
        tl.fromTo(sel, { rotation: rot, x: 0, y: 0, scale: 0.3, opacity: 0 }, { x, y, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" }, 4.0);
        tl.to(sel, { opacity: 0, scale: 0.6, duration: 0.3, ease: "power2.in" }, 4.9);
      });
      // «guarda meglio»: zoom deciso sul volto e cambio di scena liquido
      tl.to("#cam", { scale: 1.45, duration: 0.5, ease: "power4.inOut" }, 5.06);

      // ================= CHIUSURA =================
      const T = 6.0;
      reveal(["#end-bg", "#end-wrap"], T, "50% 45%");
      ["#end-c1", "#end-c2", "#end-c3"].forEach((c, i) => tl.fromTo(c, { scale: 0 }, { scale: 1, duration: 0.4, ease: E.back }, T + 0.4 + i * 0.08));
      tl.to("#end-c1", { x: 260, y: 220, scale: 0.2, opacity: 0, duration: 0.5, ease: E.in }, T + 0.85);
      tl.to("#end-c2", { x: -270, y: 140, scale: 0.2, opacity: 0, duration: 0.5, ease: E.in }, T + 0.85);
      tl.to("#end-c3", { x: 20, y: -220, scale: 0.2, opacity: 0, duration: 0.5, ease: E.in }, T + 0.85);
      tl.fromTo("#lg-left", { x: -6, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: E.back }, T + 1.25);
      tl.fromTo("#lg-right", { x: 6, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: E.back }, T + 1.25);
      tl.fromTo("#lg-leaf-l", { scale: 0, transformOrigin: "100% 100%" }, { scale: 1, duration: 0.45, ease: "back.out(3)" }, T + 1.6);
      tl.fromTo("#lg-leaf-r", { scale: 0, transformOrigin: "0% 100%" }, { scale: 1, duration: 0.45, ease: "back.out(3)" }, T + 1.7);
      lines("#end-name", T + 1.8);

      window.__timelines["main"] = tl;
    </script>
